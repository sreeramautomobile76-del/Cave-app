<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123b72">
<script>try{ if(localStorage.getItem("CAVE_DARK")==="1") document.documentElement.classList.add("dark"); }catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CAVE - Business Management</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f7fe;color:#1b2559}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:480px;min-height:100vh;margin:auto;background:#f8fbff;box-shadow:0 0 30px #0001;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.main-content{flex:1;animation:fadeIn 0.25s ease-in-out;padding-bottom:70px;min-height:0}
body.order-entry-active{overflow:hidden}
body.order-entry-active .nav{display:none!important}
.order-entry-page{padding-bottom:24px!important}
@media (max-width:600px){body.order-entry-active .app{min-height:100dvh;height:100dvh} body.order-entry-active .main-content{padding-bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch} body.order-entry-active .content{padding-bottom:28px}}
.top{background:#123b72;color:white;padding:34px 24px 22px;border-radius:0 0 24px 24px;position:relative}
.logo{font-size:34px;font-weight:800;letter-spacing:2px}
.sub{opacity:.8;margin-top:4px}
.content{padding:18px}
.card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,0.03);transition:opacity 0.3s ease}
.card:active{transform:none}
.card.completed-faded{opacity:0.55;background:#f8fafc}
h1,h2,h3{margin-top:0}
.muted{color:#71809a}
.btn{width:100%;border:0;border-radius:12px;padding:14px 16px;background:#1670e8;color:white;font-weight:700;margin-top:10px}
.btn.secondary{background:white;color:#1670e8;border:1px solid #1670e8}
.btn.danger{background:#ee5d50;color:white}
.btn.success{background:#25d366;color:white}
.btn.warning{background:#d69e2e;color:white}
input,select,textarea{width:100%;padding:14px;border:1px solid #ccd8e8;border-radius:11px;margin:7px 0 12px;outline:none;color:#14213d;background:#ffffff;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:#1670e8}
.uppercase-input{text-transform:uppercase}
.hero{text-align:center;padding:28px 10px}
.hero-icon{font-size:58px}
.hero h1{font-size:34px;margin:10px 0}
.business{display:flex;align-items:center;gap:14px}
.business-icon{width:52px;height:52px;border-radius:14px;background:#e6f0ff;display:grid;place-items:center;font-size:25px}
.dashboard-head{background:#123b72;color:white;padding:22px 20px;border-radius:0 0 24px 24px;display:flex;justify-content:space-between;align-items:center}
.settings-btn{background:rgba(255,255,255,0.2);border:none;color:white;font-size:20px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}

/* Navigation */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255, 255, 255, 0.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;padding:8px 10px;z-index:99;box-shadow:0 -4px 20px rgba(0,0,0,0.05)}
.nav button{flex:1;border:0;background:none;color:#8f9bba;font-size:11px;font-weight:600;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all 0.2s}
.nav button svg{width:22px;height:22px;fill:currentColor}
.nav button.active{color:#1670e8;font-weight:700}

.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:18px;border-radius:16px;border:1px solid #e2e8f0;background:white;cursor:pointer}
.tile b{display:block;margin-bottom:8px}
.list{padding:15px;border:1px solid #e2e8f0;border-radius:14px;background:white;margin:10px 0;display:flex;justify-content:space-between;align-items:center;user-select:none;-webkit-user-select:none}
.small{font-size:12px}

.item-head{display:grid;grid-template-columns:minmax(0,1fr) 60px 65px 36px;gap:6px;margin:4px 0 6px;padding:0 2px;font-size:11px;font-weight:700;color:#71809a}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) 60px 65px 36px;gap:6px;align-items:center;margin-bottom:6px}
.item-row input, .item-row select{margin:0;padding:10px 6px;font-size:13px}
.item-row .remove-item{height:40px;width:36px;border:1px solid #f0b8b8;background:#fff;color:#d64545;border-radius:10px;font-weight:700}
.items-box{margin:8px 0 14px}
.order-card-click{cursor:pointer;user-select:none;-webkit-user-select:none}

.item-check-row{display:flex;align-items:center;justify-content:space-between;padding:12px 8px;border-bottom:1px solid #f0f4f9;transition:all 0.3s ease;user-select:none;-webkit-user-select:none;border-radius:8px}
.item-check-row.selected-item{background:#e6f0ff !important;border:1px solid #1670e8}
.item-check-row.delete-mode-item{background:#fff5f5 !important;border:1px solid #ee5d50}
.item-check-row:last-child{border-bottom:none}
.item-check-row.animating-out{opacity:0;transform:translateY(12px);background:#f0f7ff}
.circle-btn{width:26px;height:26px;border-radius:50%;border:2px solid #a0aec0;display:inline-grid;place-items:center;margin-right:12px;flex-shrink:0;transition:all 0.2s;font-size:12px;font-weight:bold;cursor:pointer}
.circle-btn.checked{background:#1670e8;border-color:#1670e8;color:white}
.item-left{display:flex;align-items:center;font-weight:600;font-size:14px;color:#2d3748}
.item-picked-tag{font-size:10px;color:#25d366;font-weight:bold;margin-top:2px}
.item-qty-tag{font-size:13px;color:#71809a;font-weight:600}
.section-title{font-size:16px;font-weight:700;margin:16px 0 10px;color:#1a202c}
.back-btn{background:none;border:none;color:#1670e8;font-weight:bold;padding:0;margin-bottom:12px;display:inline-flex;align-items:center;gap:4px}
.badge{padding:4px 8px;border-radius:8px;font-size:11px;font-weight:700;display:inline-block;margin-right:4px}
.badge-closed{background:#edf2f7;color:#4a5568}
.badge-adopted{background:#ebf8ff;color:#2b6cb0;border:1px solid #bee3f8}
.badge-cust{background:#edf2f7;color:#2d3748;font-size:10px;padding:2px 6px;border-radius:4px;margin-right:4px;font-weight:normal}
.unread-badge{background:#25d366;color:white;font-size:11px;font-weight:bold;padding:2px 7px;border-radius:10px;margin-left:6px;display:inline-block}

/* Micro inline status bars */
.inline-bars{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:bold;margin-left:6px}
.bar-pill{background:#edf2f7;padding:2px 6px;border-radius:6px;color:#4a5568}

.del-icon-btn{background:none;border:none;color:#a0aec0;font-size:18px;padding:6px;border-radius:8px;transition:0.2s}
.del-icon-btn:active{color:#e53e3e;background:#fff5f5}

/* Tabs & Header Controls */
.order-header-row{display:flex;align-items:center;gap:6px;margin-bottom:12px;position:relative}
.tab-bar{display:flex;gap:4px;background:#e2e8f0;padding:3px;border-radius:12px;flex:1}
.tab-btn{flex:1;border:none;padding:8px 4px;border-radius:8px;font-size:12px;font-weight:700;color:#4a5568;background:transparent;transition:all 0.2s}
.tab-btn.active{background:white;color:#1670e8;box-shadow:0 2px 6px rgba(0,0,0,0.06)}
.compact-search-box{display:flex;align-items:center;background:white;border:1px solid #ccd8e8;border-radius:10px;padding:4px 8px;width:110px}
.compact-search-box input{border:none;margin:0;padding:4px;font-size:12px;background:transparent;width:100%}
.three-dots-container{position:relative;display:inline-block}
.three-dots-btn{background:white;border:1px solid #ccd8e8;border-radius:10px;padding:6px 10px;font-size:16px;font-weight:bold;color:#123b72;cursor:pointer}

/* Custom Suggestion List */
.cust-suggest-box{max-height:110px;overflow-y:auto;background:white;border:1px solid #ccd8e8;border-radius:10px;margin-top:-6px;margin-bottom:12px;box-shadow:0 4px 10px rgba(0,0,0,0.05);display:none}
.cust-suggest-item{padding:8px 12px;font-size:13px;border-bottom:1px solid #f0f4f9;cursor:pointer}
.cust-suggest-item:hover{background:#f0f5ff}

/* Dropdown Menu - Position Fixed to Container */
.menu-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:998}
.dropdown-menu{position:absolute;top:100%;right:0;margin-top:6px;background:white;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:999;width:230px;padding:6px 0;animation:fadeIn 0.15s ease-out}
.menu-item{padding:12px 16px;font-size:13px;font-weight:600;color:#1b2559;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:1px solid #f0f4f9}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:#f0f5ff}

#page{overflow-anchor:none}
.date-nav{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#1670e8}
.date-nav button{border:1px solid #cfe0ff;background:#fff;color:#1670e8;border-radius:10px;width:30px;height:28px;font-size:12px;padding:0}
.date-nav button:disabled{opacity:.35}
.date-nav>span{min-width:72px;text-align:center;cursor:pointer}
.chist-day{margin:14px 0 6px;font-size:13px;font-weight:800;color:#718096;letter-spacing:.3px}
.chist-order{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;margin-bottom:8px;border:1px solid #e2e8f0;border-radius:14px;background:#fff;cursor:pointer}
.chist-chip{display:inline-block;margin:4px 6px 0 0;padding:3px 9px;border-radius:999px;background:#f1f5f9;font-size:12px;font-weight:700;color:#2d3748}
html.dark{filter:invert(.92) hue-rotate(180deg);background:#fff}
html.dark img,html.dark video,html.dark canvas,html.dark iframe,html.dark mark.hl{filter:invert(1) hue-rotate(180deg)}
html.dark .packed-stamp{filter:invert(1) hue-rotate(180deg);mix-blend-mode:normal;background:transparent}
.bill-opt{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:14px;font-weight:600}
.bill-opt input{width:20px;height:20px}
.act-bar{display:flex;align-items:center;gap:8px;margin:10px 0}
.act-bar button{border:1px solid #e2e8f0;background:#fff;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700}
.act-bar button:disabled{opacity:.35}
.act-bar .act-date{flex:1;text-align:center;font-weight:800;color:#1b2559}
.act-tabs{display:flex;gap:6px;margin-bottom:12px}
.act-tab{flex:1;padding:9px 4px;border-radius:12px;border:1px solid #e2e8f0;background:#fff;font-size:13px;font-weight:700;color:#4a5568}
.act-tab.on{background:#1670e8;border-color:#1670e8;color:#fff}
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.act-stat{padding:12px;border-radius:14px;background:#f1f5f9;text-align:center}
.act-stat b{display:block;font-size:22px;color:#1b2559}
.act-stat span{font-size:11px;color:#718096;font-weight:600}
.act-worker{padding:12px;margin-bottom:10px;border:1px solid #e2e8f0;border-radius:14px;background:#fff}
.act-chip{display:inline-block;margin:6px 6px 0 0;padding:3px 9px;border-radius:999px;background:#f1f5f9;font-size:12px;font-weight:700;color:#2d3748}
.act-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #edf2f7;font-size:13px}
.act-row .act-time{flex-shrink:0;width:54px;color:#718096;font-weight:700;font-size:12px}
.act-row .act-text{min-width:0;overflow-wrap:anywhere}
.urgent-badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:#e53e3e;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.3px;vertical-align:middle}
.item-check-row.urgent-row{border-left:4px solid #e53e3e;padding-left:8px;background:#fff8f8}
.active-filter{display:inline-flex;align-items:center;gap:8px;margin:0 0 10px;padding:6px 6px 6px 12px;border-radius:999px;background:#e6f0ff;color:#1670e8;font-size:12.5px;font-weight:700}
.active-filter button{border:0;background:#1670e8;color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;line-height:1;padding:0}
.filter-chip-btn{display:block;width:100%;text-align:left;margin:0 0 8px;padding:12px 14px;border-radius:12px;border:1px solid #e2e8f0;background:#fff;font-size:14px;font-weight:600;color:#2d3748}
.filter-chip-btn.on{background:#e6f0ff;border-color:#1670e8;color:#1670e8}
.cust-link{border-bottom:1.5px dotted #1670e8;cursor:pointer}
.hist-order{padding:10px 12px;margin-bottom:8px;border:1px solid #e2e8f0;border-radius:12px;background:#fff}
.hist-stats{display:flex;gap:8px;margin:10px 0}
.hist-stat{flex:1;text-align:center;padding:8px 4px;border-radius:12px;background:#f1f5f9}
.hist-stat b{display:block;font-size:17px;color:#1b2559}
.hist-stat span{font-size:10.5px;color:#718096;font-weight:600}
.search-hits{margin-top:8px;border-top:1px dashed #e2e8f0;padding-top:6px}
.search-hit{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px;color:#2d3748}
.search-hit .hit-name{min-width:0;overflow-wrap:anywhere;font-weight:600}
.search-hit .hit-qty{flex-shrink:0;font-size:12px;color:#71809a;font-weight:600}
.search-hit .item-comment{font-weight:500}
.search-more{font-size:11px;color:#718096;padding-top:2px}
mark.hl{background:#fff2a8;color:inherit;border-radius:3px;padding:0 1px}
#selectionActions{position:fixed;top:0;left:0;right:0;margin:0 auto;max-width:480px;z-index:70;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;background:#fff;border-bottom:1px solid #e2e8f0;box-shadow:0 3px 12px rgba(0,0,0,.12);justify-content:center;flex-wrap:wrap;gap:6px}
#app.orders-fullscreen #selectionActions{max-width:none}
.order-card-click{position:relative}
.packed-stamp{position:absolute;pointer-events:none;z-index:3;text-align:center;font-weight:900;letter-spacing:3px;color:#1f8a3b;border:3px solid #1f8a3b;border-radius:8px;padding:3px 12px 2px;transform:rotate(-13deg);opacity:.88;background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 2px rgba(31,138,59,.35);line-height:1.1;mix-blend-mode:multiply}
.packed-stamp b{display:block;font-size:20px}
.packed-stamp small{display:block;font-size:9px;letter-spacing:.5px;font-weight:700;margin-top:1px;text-transform:uppercase}
.packed-stamp.lg{top:46px;right:12px}
.packed-stamp.sm{top:50%;left:50%;right:auto;transform:translate(-50%,-50%) rotate(-13deg);padding:3px 16px 2px;border-width:3px}
.packed-stamp.sm b{font-size:22px;letter-spacing:4px}
.packed-stamp.pop{animation:stampIn .45s cubic-bezier(.2,1.4,.4,1) both}
.packed-stamp.sm.pop{animation:stampInC .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stampInC{0%{transform:translate(-50%,-50%) rotate(-13deg) scale(2.4);opacity:0}60%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-13deg) scale(1);opacity:.88}}
@keyframes stampIn{0%{transform:rotate(-13deg) scale(2.4);opacity:0}60%{opacity:1}100%{transform:rotate(-13deg) scale(1);opacity:.88}}
.item-comment{margin-top:3px;font-size:12px;font-weight:500;color:#4a5568;background:#f1f5f9;border-left:3px solid #1670e8;border-radius:6px;padding:3px 7px;white-space:pre-wrap;overflow-wrap:anywhere}
.item-comment span{color:#718096;font-size:10.5px;font-weight:600}
.modal.add-items-modal{display:flex;flex-direction:column;max-height:88dvh;overflow:hidden}
.modal.add-items-modal .items-box{flex:1 1 auto;min-height:56px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.modal.add-items-modal>*{flex-shrink:0}
.modal.add-items-modal>.items-box{flex-shrink:1}
#stickyCust{position:fixed;top:0;left:0;right:0;margin:0 auto;max-width:480px;z-index:60;height:calc(env(safe-area-inset-top,0px) + 44px);background:rgba(255,255,255,.97);border-bottom:1px solid #e2e8f0;box-shadow:0 3px 10px rgba(0,0,0,.07);opacity:0;pointer-events:none}
#stickyViewers{position:fixed;top:calc(env(safe-area-inset-top,0px) + 44px);left:0;right:0;margin:0 auto;max-width:480px;z-index:59;padding:6px 12px;background:rgba(255,255,255,.97);border-bottom:1px solid #e2e8f0;box-shadow:0 3px 8px rgba(0,0,0,.05);font-size:11.5px;font-weight:700;color:#1b6b3a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;pointer-events:none}
#stickyViewers:empty{display:none}
#app.orders-fullscreen #stickyViewers{max-width:none}
#stickyCustTxt{position:fixed;top:0;left:0;z-index:61;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform-origin:left top;opacity:0;pointer-events:none;font-weight:800;color:#1b2559;will-change:transform}
#app.orders-fullscreen #stickyCust{max-width:none}
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn 0.2s}
.modal{background:white;padding:20px;border-radius:20px;width:90%;max-width:400px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#123b72;color:white;padding:12px 20px;border-radius:30px;font-size:13px;font-weight:bold;z-index:9999;box-shadow:0 4px 15px rgba(0,0,0,0.2);animation:fadeIn 0.3s}
#netBadge{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#b7791f;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;z-index:9998;display:none;box-shadow:0 2px 10px rgba(0,0,0,.2);white-space:nowrap}

/* Stock view uses the full available screen width; other CAVE pages keep their original layout. */
#app.stock-fullscreen{width:100%;max-width:none;height:100dvh;min-height:100dvh;margin:0;border-radius:0;box-shadow:none}
#app.stock-fullscreen .main-content{padding-bottom:64px}
#app.stock-fullscreen .content{padding:0}
#app.stock-fullscreen #page{width:100%;margin:0;padding:0}
#app.stock-fullscreen .nav{max-width:none;width:100%;left:0;transform:none}
/* Orders list uses full screen width without changing the layout of other sections. */
#app.orders-fullscreen{width:100%;max-width:none;min-height:100dvh;margin:0;border-radius:0;box-shadow:none}
#app.orders-fullscreen .main-content{padding-bottom:70px;width:100%;min-width:0}
#app.orders-fullscreen .content{padding:10px;width:100%;min-width:0}
#app.orders-fullscreen #page{width:100%;max-width:none;margin:0;padding:0}
#app.orders-fullscreen .nav{max-width:none;width:100%;left:0;transform:none}
#app.stock-chat-active .nav{display:none!important}
#app.stock-chat-active .main-content{padding-bottom:0!important}
#app.stock-chat-active #page{padding:0!important}
#app.stock-chat-active #caveStockFrame{height:100dvh!important;min-height:100dvh!important}
</style>
</head>
<body>
<div id="netBadge">📴 Offline - changes saved on this phone</div>
<div class="app" id="app"></div>

<script>
/* Storage safety: some browsers/WebViews (content://, file://, APK without DOM storage) block localStorage.
   Fall back to in-memory storage so the app still opens instead of going blank. */
(function(){
  var ok=false;
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ok=true; }catch(e){}
  if(!ok){
    var m={};
    var fake={getItem:function(k){return Object.prototype.hasOwnProperty.call(m,k)?m[k]:null;},setItem:function(k,v){m[k]=String(v);},removeItem:function(k){delete m[k];},clear:function(){m={};},key:function(i){return Object.keys(m)[i]||null;}};
    try{ Object.defineProperty(window,"localStorage",{value:fake,configurable:true}); }catch(e){ try{ window.localStorage=fake; }catch(e2){} }
    window.__storageBlocked=true;
  }
})();
window.addEventListener("error",function(e){
  var d=document.createElement("div");
  d.style.cssText="position:fixed;left:8px;right:8px;bottom:8px;background:#b00020;color:#fff;padding:10px;border-radius:10px;font:12px monospace;z-index:99999";
  d.textContent="Error: "+(e.message||"")+" (line "+(e.lineno||"?")+")";
  document.body&&document.body.appendChild(d);
});
</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

/* ---------- Sync / merge helpers (offline support + no overwriting between devices) ---------- */
const _snap = {};
function _h(s){ let h = 0; for(let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; } return Math.abs(h).toString(36); }
function _sig(o){ const c = Object.assign({}, o); delete c.updatedAt; delete c.items; delete c.deletedItems; return JSON.stringify(c); }
function jsq(s){ return esc(String(s || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'")); }
function orderLocalIso(o){
  try {
    const d = new Date(o.date);
    if(isNaN(d.getTime())) return "";
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  } catch(e){ return ""; }
}
/* Firebase turns arrays with gaps into objects. Convert them back to arrays everywhere. */
function toArr(x){
  if(Array.isArray(x)) return x;
  if(x && typeof x === "object"){
    return Object.keys(x).sort(function(a,b){ return (Number(a)-Number(b)) || (a<b?-1:a>b?1:0); }).map(function(k){ return x[k]; }).filter(function(v){ return v != null; });
  }
  return [];
}
function normB(b){
  if(!b || typeof b !== "object") return b;
  ["orders","team","customers","removedIds"].forEach(function(k){ if(b[k] != null) b[k] = toArr(b[k]); });
  (b.orders || []).forEach(function(o){
    if(o && typeof o === "object"){ ["items","deletedItems"].forEach(function(k){ if(o[k] != null) o[k] = toArr(o[k]); }); }
  });
  return b;
}
function ensureIds(b){
  normB(b);
  (b.orders || []).forEach(function(o){
    if(!o) return;
    if(!o.id) o.id = "LEG_" + _h(JSON.stringify([o.customer, o.date, o.time, (o.items || []).length]));
    (o.items || []).forEach(function(it, i){ if(it && !it.id) it.id = "LEGI_" + _h(o.id + "|" + (it.name || "") + "|" + i); });
  });
  (b.team || []).forEach(function(m){ if(m && !m.id) m.id = "LEGM_" + _h((m.name || "") + "|" + (m.mobile || "")); });
  (b.customers || []).forEach(function(c){ if(c && !c.id) c.id = "LEGC_" + _h((c.name || "") + "|" + (c.phone || "")); });
}
function seedSnap(b){
  if(!b) return;
  ensureIds(b);
  (b.orders || []).forEach(function(o){
    if(!o) return;
    _snap[o.id] = _sig(o);
    (o.items || []).concat(o.deletedItems || []).forEach(function(it){ if(it && it.id) _snap[it.id] = _sig(it); });
  });
}
function stampB(b){
  ensureIds(b);
  const now = Date.now();
  (b.orders || []).forEach(function(o){
    if(!o) return;
    (o.items || []).concat(o.deletedItems || []).forEach(function(it){
      if(!it || !it.id) return;
      const s = _sig(it);
      if(_snap[it.id] !== s){ it.updatedAt = now; _snap[it.id] = _sig(it); }
    });
    const os = _sig(o);
    if(_snap[o.id] !== os){ o.updatedAt = now; _snap[o.id] = os; }
  });
}
function mergeOrder(a, b){
  const newer = ((b.updatedAt || 0) >= (a.updatedAt || 0)) ? b : a;
  const out = Object.assign({}, newer);
  const best = new Map();
  function pick(it, del){
    if(!it || !it.id) return;
    const c = best.get(it.id);
    if(!c || (it.updatedAt || 0) >= (c.it.updatedAt || 0)) best.set(it.id, { it: it, del: del });
  }
  [a, b].forEach(function(o){
    (o.items || []).forEach(function(it){ pick(it, false); });
    (o.deletedItems || []).forEach(function(it){ pick(it, true); });
  });
  out.items = []; out.deletedItems = [];
  best.forEach(function(v){ (v.del ? out.deletedItems : out.items).push(v.it); });
  return out;
}
function mergeOrders(r, l){
  const map = new Map();
  (r || []).forEach(function(o){ if(o && o.id) map.set(o.id, o); });
  (l || []).forEach(function(o){
    if(!o || !o.id) return;
    const e = map.get(o.id);
    map.set(o.id, e ? mergeOrder(e, o) : o);
  });
  return Array.from(map.values());
}
function mergeList(r, l, removed, isTeam){
  const map = new Map();
  (r || []).forEach(function(x){ if(x && x.id && removed.indexOf(x.id) === -1) map.set(x.id, x); });
  (l || []).forEach(function(x){
    if(!x || !x.id || removed.indexOf(x.id) !== -1) return;
    const e = map.get(x.id);
    if(!e){ map.set(x.id, x); }
    else if(isTeam && x.isAdmin && !e.isAdmin){ map.set(x.id, Object.assign({}, e, { isAdmin: true, role: x.role })); }
  });
  return Array.from(map.values());
}
function mergeBusiness(remote, local){
  if(!remote) return local;
  if(!local) return remote;
  ensureIds(remote); ensureIds(local);
  const base = ((local.profileUpdatedAt || 0) > (remote.profileUpdatedAt || 0)) ? local : remote;
  const out = Object.assign({}, remote, base);
  const removed = Array.from(new Set((remote.removedIds || []).concat(local.removedIds || [])));
  out.removedIds = removed;
  out.orders = mergeOrders(remote.orders, local.orders);
  out.team = mergeList(remote.team, local.team, removed, true);
  out.customers = mergeList(remote.customers, local.customers, removed, false);
  const rn = remote.lastNotification, ln = local.lastNotification;
  if(rn || ln) out.lastNotification = (((ln && ln.timestamp) || 0) > ((rn && rn.timestamp) || 0)) ? ln : rn;
  return out;
}
function _dk(id){ return "CAVE_DIRTY_" + id; }
function syncNow(){
  if(!hasFB) return;
  const b = current();

      return JSON.parse(JSON.stringify(mergeBusiness(remote, cur)));
    }, function(err, committed){
      if(!err && committed){ try { localStorage.removeItem(_dk(id)); } catch(e){} }
    }, true);
  } catch(e){}
}

function genId(prefix="ID") {
  return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).substr(2, 5);

function vibrate(ms = 30) {
  try {
    if (navigator && typeof navigator.vibrate === "function") {
      navigator.vibrate(ms);
    }
  } catch(e){}
}

function playNotificationSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

function showToast(msg) {
  let toast = document.createElement("div");
  toast.className = "toast";
  toast.innerText = msg;
  document.body.appendChild(toast);
  vibrate([40, 30, 40]);
  playNotificationSound();
  setTimeout(() => toast.remove(), 3500);
}

function listenToFirebase(){
  if(activeFirebaseRef) {
    activeFirebaseRef.off();
    activeFirebaseRef = null;
  }
  if(!data.currentBusiness) return;
  let busId = data.currentBusiness;
  window.lastNotifTime = Number(localStorage.getItem("CAVE_LASTNOTIF_" + busId)) || 0;
  activeFirebaseRef = db.ref("businesses/" + busId);
  activeFirebaseRef.on("value", function(snapshot){
    let cloudData = normB(snapshot.val());
    if(cloudData){
      let idx = data.businesses.findIndex(x => x.id === busId);
      
      if(cloudData.lastNotification && cloudData.lastNotification.timestamp > (window.lastNotifTime || 0)) {
        if(window.lastNotifTime) {
          showToast("🔔 " + cloudData.lastNotification.text);
          notifySystem(cloudData.lastNotification);
        }
        window.lastNotifTime = cloudData.lastNotification.timestamp;
        try { localStorage.setItem("CAVE_LASTNOTIF_" + busId, String(window.lastNotifTime)); } catch(e){}
      }

      if(idx !== -1){
        data.businesses[idx] = mergeBusiness(cloudData, data.businesses[idx]);
        seedSnap(data.businesses[idx]);
      } else {
        data.businesses.push(cloudData);
        seedSnap(cloudData);
      }
      localStorage.setItem(KEY, JSON.stringify(data));
      
      // IMPORTANT: never re-render the UI while the user is entering an order.
      // Firebase can receive updates from another device at any moment; rebuilding
      // the page here used to kick the user out of Create New Order.
      if(orderEntryActive || currentScreen === "newOrder") return;
      if(currentScreen === "orderDetail" && window.activeOrderDetailId){ refreshOrderDetailLive(); return; }

      let activeTab = document.querySelector(".nav button.active");
      if(activeTab){
        let txt = activeTab.innerText.trim();
        if(txt.includes("Orders")) filterOrders();
        else if(txt.includes("Home")) pageHome(activeTab);
        else if(txt.includes("Team")) pageTeam(activeTab);
        else if(txt.includes("Customers")) pageCustomers(activeTab);
      }
    }
  });
}

// Phone (system) notification - shown when the app is in background / another tab.
function notifySystem(n){
  try {
    if(!n || !document.hidden) return;
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    let me = getCurrentMember();
    if(me && n.by && n.by === me.name) return;
    let opts = { body: n.text, tag: "cave-" + n.timestamp, renotify: true, vibrate: [200, 100, 200] };
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(r){ return r.showNotification("CAVE", opts); }).catch(function(){
        try { new Notification("CAVE", { body: n.text }); } catch(e){}
      });
    } else {
      new Notification("CAVE", { body: n.text });
    }
  } catch(e){}
}

function enableNotifications(){
  if(!("Notification" in window)){ alert("This browser does not support notifications."); return; }
  if(Notification.permission === "granted"){ showToast("Notifications are already enabled."); return; }
  if(Notification.permission === "denied"){ alert("Notifications are blocked. Please enable them from your browser / app settings."); return; }
  Notification.requestPermission().then(function(p){
    showToast(p === "granted" ? "Notifications enabled!" : "Notifications not allowed.");
  });
}

function esc(s){
  return String(s||"").replace(/[&<>"']/g, function(m) {
    if (m === "&") return "&amp;";
    if (m === "<") return "&lt;";
    if (m === ">") return "&gt;";
    if (m === '"') return "&quot;";
    if (m === "'") return "&#039;";
    return m;
  });
}

function createBusiness(){
  vibrate(30);
  let name = document.getElementById("bn").value.trim().toUpperCase();
  let mobile = document.getElementById("bm").value.trim();
  let owner = document.getElementById("bo").value.trim().toUpperCase();
  if(!name || !owner){ alert("Please enter Business & Owner name."); return; }
  let id = "CAVE-" + Math.floor(100000 + Math.random() * 900000);
  let b = { 
    id: id, 
    name: name, 
    mobile: mobile, 
    owner: owner, 
    customers: [], 
    orders: [], 
    team: [{ id: genId("MEM"), name: owner, role: "Owner", mobile: mobile, isAdmin: true, isCreator: true }] 
  };

  data.currentBusiness = id;

function joinBusiness(){
  vibrate(30);
  let id = document.getElementById("jid").value.trim().toUpperCase();
  let name = document.getElementById("jn").value.trim().toUpperCase();
  let mobile = document.getElementById("jm").value.trim();
  if(!id || !name || !mobile){ alert("Please enter all details."); return; }
  if(!hasFB || !navigator.onLine){ alert("Internet connection is required to join a business."); return; }
  
  db.ref("businesses/" + id).once("value", function(snapshot){
    let b = normB(snapshot.val());
    if(!b){ alert("Business ID not found in database!"); return; }
    if(!b.team) b.team = [];
    let existingM = b.team.find(m => m && (m.mobile === mobile || String(m.name || "").toUpperCase() === name));
    if(existingM){
      name = existingM.name;
    } else {
      b.team.push({ id: genId("MEM"), name: name, mobile: mobile, role: "Member", isAdmin: false, isCreator: false });
    }
    
    let localIdx = data.businesses.findIndex(x => x.id === id);
    if(localIdx !== -1) data.businesses[localIdx] = b;
    else data.businesses.push(b);
    
    data.currentBusiness = id;
  updateDraftKey();
    data.currentUser = name;
    save();
    listenToFirebase();
    dashboard();
  });
}

function current(){
  let b = data.businesses.find(function(b){ return b.id === data.currentBusiness; });
  if(b){
    if(!b.orders) b.orders = [];
    if(!b.customers) b.customers = [];
    if(!b.team) b.team = [];
  }
  return b;
}

function getCurrentMember() {
  let b = current();
  if(!b) return null;
  let user = b.team.find(m => m.name === data.currentUser) || b.team[0];
  return user;
}

function openSettings(){
  vibrate(20);
  let b = current();
  let me = getCurrentMember();
  let modal = document.createElement("div");
  modal.className = "modal-overlay";
  modal.innerHTML =
    '<div class="modal" style="max-height:85vh;overflow-y:auto">' +
      '<h2 style="margin-bottom:12px">🏢 Profile & Settings</h2>' +
      '<div style="background:#f0f5ff;padding:12px;border-radius:12px;margin-bottom:14px">' +
        '<div style="font-size:18px;font-weight:bold;color:#123b72">' + esc(b.name) + '</div>' +
        '<div style="font-size:13px;color:#71809a;margin-top:2px">ID: <b>' + esc(b.id) + '</b></div>' +
      '</div>' +
      '<div style="font-size:14px;line-height:1.8;margin-bottom:16px">' +
        '<div>👤 <b>Active User:</b> ' + esc(me ? me.name : "Unknown") + ' (' + esc(me ? me.role : "Member") + ')</div>' +
        '<div>👑 <b>Owner:</b> ' + esc(b.owner || "Not Specified") + '</div>' +
        '<div>📞 <b>Mobile:</b> ' + esc(b.mobile || "Not Specified") + '</div>' +
      '</div>' +
      '<button class="btn secondary" style="margin-top:0" onclick="copyBusinessID(\'' + esc(b.id) + '\')">📋 Copy Business ID</button>' +
      '<button class="btn secondary" style="margin-top:8px" onclick="switchActiveUserModal()">👤 Switch Current User</button>' +

function switchActiveUserModal(){
  let b = current();
  let options = (b.team || []).map(m => '<option value="' + esc(m.name) + '" ' + (m.name === data.currentUser ? 'selected' : '') + '>' + esc(m.name) + ' (' + esc(m.role) + ')</option>').join('');
  let modal = document.createElement("div");
  modal.className = "modal-overlay";
  modal.innerHTML =
    '<div class="modal">' +
      '<h3>Select Active User</h3>' +
      '<p class="muted small">Choose your identity on this device:</p>' +
      '<select id="activeUserSelect">' + options + '</select>' +
      '<button class="btn" id="saveUserBtn">Set Active User</button>' +
    '</div>';
  document.body.appendChild(modal);
  document.getElementById("saveUserBtn").onclick = function(){
    data.currentUser = document.getElementById("activeUserSelect").value;
    save();
    modal.remove();
    document.querySelectorAll(".modal-overlay").forEach(function(m){ m.remove(); });
    dashboard();
  };
}

function confirmExitBusiness(){
  confirmAction("Exit Business?", "Are you sure you want to exit this business?", function(){
    if(activeFirebaseRef) { activeFirebaseRef.off(); activeFirebaseRef = null; }
    data.currentBusiness = null;
    updateDraftKey();
    save();
    app();
  });
}

function copyBusinessID(id){
  vibrate(20);
  navigator.clipboard.writeText(id);
  alert("Business ID copied: " + id);
}

function editBusinessProfile(){
  if(!canPackOrder()){ showToast("Only the Owner or an Admin can edit business details"); return; }
  var b = current();
  var modal = document.createElement("div");
  modal.className = "modal-overlay";
  modal.innerHTML =
    '<div class="modal">' +
      '<h3 style="margin-bottom:12px">\u270F Edit Business Details</h3>' +
      '<label style="font-size:12px;color:#71809a">Business Name</label>' +
      '<input id="bizName" class="uppercase-input" style="margin-top:4px;margin-bottom:8px">' +
      '<label style="font-size:12px;color:#71809a">Owner Name</label>' +
      '<input id="bizOwner" class="uppercase-input" style="margin-top:4px;margin-bottom:8px">' +
      '<label style="font-size:12px;color:#71809a">Mobile</label>' +
      '<input id="bizMobile" inputmode="numeric" style="margin-top:4px;margin-bottom:16px">' +
      '<div style="display:flex;gap:10px">' +
        '<button class="btn secondary" style="margin:0;flex:1" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>' +
        '<button class="btn" style="margin:0;flex:1" id="saveBizBtn">Save</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(modal);
  document.getElementById("bizName").value = b.name || "";
  document.getElementById("bizOwner").value = b.owner || "";
  document.getElementById("bizMobile").value = b.mobile || "";
  document.getElementById("saveBizBtn").onclick = function(){
    if(!canPackOrder()) return;
    var n = document.getElementById("bizName").value.trim().toUpperCase();
    if(!n){ alert("Business name cannot be empty."); return; }
    b.name = n;
    b.owner = document.getElementById("bizOwner").value.trim().toUpperCase();
    b.mobile = document.getElementById("bizMobile").value.trim();
    b.profileUpdatedAt = Date.now();
    save();
    document.querySelectorAll(".modal-overlay").forEach(function(m){ m.remove(); });
    showToast("Business details updated");
    pageHome(document.getElementById("nav-home"));
  };
}


// Android/browser back gesture support: handle in-app screens before allowing the page to close.
let caveBackHandling = false;
function pushCaveBackGuard(){
  try { history.pushState({caveBackGuard:true, nonce:Date.now()}, "", location.href); } catch(e) {}
}
function handleCaveSystemBack(){
  if(caveBackHandling) return;
  caveBackHandling = true;
  try {
    const modal = document.querySelector('.modal-overlay');
    if(modal){ modal.remove(); return; }
    const appRoot = document.getElementById('app');
    if(currentScreen === 'stock' && appRoot && appRoot.classList.contains('stock-chat-active')){
      const frame = document.getElementById('caveStockFrame');
      if(frame && frame.contentWindow) frame.contentWindow.postMessage({type:'CAVE_STOCK_BACK'}, '*');
      return;
    }
    if(currentScreen === 'newOrder'){
      orderEntryActive = false;
      document.body.classList.remove('order-entry-active');
      pageOrders(document.getElementById('nav-orders'));
      return;
    }
    if(currentScreen === 'custHistory'){
      custHistBack();
      return;
    }
    if(currentScreen === 'orderDetail'){
      pageOrders(document.getElementById('nav-orders'));
      return;
    }
    if(currentScreen !== 'home'){
      pageHome(document.getElementById('nav-home'));
      return;
    }
    // At the dashboard, keep the app open instead of letting a swipe close it accidentally.
  } finally {
    setTimeout(function(){ pushCaveBackGuard(); caveBackHandling = false; }, 0);
  }
}
window.addEventListener('popstate', handleCaveSystemBack);
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', pushCaveBackGuard, {once:true});
else pushCaveBackGuard();

window.addEventListener('message', function(e){
  if(!e.data || e.data.type !== 'CAVE_STOCK_CHAT_STATE') return;
  const frame = document.getElementById('caveStockFrame');
  if(!frame || e.source !== frame.contentWindow) return;
  const appRoot = document.getElementById('app');
  if(appRoot && currentScreen === 'stock') appRoot.classList.toggle('stock-chat-active', !!e.data.open);
});

function pageHome(btn){
  orderEntryActive = false;
  document.body.classList.remove("order-entry-active");
  currentScreen = "home";
  active(btn);
  setLastView("home");
  let b = current();
  document.getElementById("header-area").innerHTML =
    '<div class="dashboard-head"><div><div class="logo" style="font-size:24px">CAVE</div><h2 style="margin:4px 0 0;font-size:20px">' + esc(b.name) + '</h2></div><button class="settings-btn" onclick="openSettings()">⚙️️</button></div>';
    
  let todayIso = getTodayIsoString();
  let todayLabel = new Date().toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' });
  let validOrdersCount = (b.orders || []).filter(function(o){
    if(!o || o.deleted) return false;
    if(o.isoDate) return o.isoDate === todayIso;
    return o.dateOnly === todayLabel;
  }).length;

  document.getElementById("page").innerHTML =
    '<h2 style="margin-top:10px">Dashboard</h2><div class="tilegrid">' +
      '<div class="tile" onclick="newOrder()"><b>➕ Create New Order</b><span class="small muted">Add items and save.</span></div>' +
      '<div class="tile" onclick="pageOrders(document.getElementById(\'nav-orders\'))"><b>📋 View Orders</b><span class="small muted">' + validOrdersCount + ' orders</span></div>' +
      '<div class="tile" onclick="pageTeam(document.getElementById(\'nav-team\'))"><b>👥 Team Members</b><span class="small muted">' + current().team.length + ' members</span></div>' +
      '<div class="tile" onclick="pageCustomers(document.getElementById(\'nav-customers\'))"><b>👤 Customers</b><span class="small muted">' + current().customers.length + ' customers</span></div>' +

    '</div>';
}

function active(btn){
  try{ stopOrderPresence(); }catch(e){}
  vibrate(15);
  const appRoot = document.getElementById("app");
  if(appRoot) {
    appRoot.classList.toggle("stock-fullscreen", currentScreen === "stock");
    appRoot.classList.toggle("orders-fullscreen", currentScreen === "orders");
    appRoot.classList.remove("stock-chat-active");
  }
  try{ var tc=document.querySelector('meta[name="theme-color"]'); if(tc) tc.setAttribute("content", currentScreen === "stock" ? "#008069" : "#123b72"); }catch(e){}
  document.querySelectorAll(".nav button").forEach(function(x){ x.classList.remove("active"); });
  if(btn) btn.classList.add("active");
}

let currentOrderTab = "all";

function ensureDailyPendingOrders(){
  const b=current(); if(!b || !Array.isArray(b.orders)) return false;
  const today=getTodayIsoString(); let changed=false;
  const latestByLineage=new Map();
  (b.orders||[]).forEach(o=>{
    if(!o || o.deleted) return;
    const d=o.isoDate || orderLocalIso(o); if(!d || d>=today) return;
    (o.items||[]).forEach(it=>{
      if(!it) return;
      const lineage=it.originItemId || it.id || (String(it.name||'')+'|'+String(it.unit||'PCS'));
      const key=String(o.customer||'').toUpperCase()+'|'+lineage;
      const prev=latestByLineage.get(key);
      if(!prev || prev.date<d || (prev.date===d && (prev.order.updatedAt||0)<(o.updatedAt||0))) latestByLineage.set(key,{order:o,item:it,date:d});
    });
  });
  const bySource=new Map();
  latestByLineage.forEach(({order,item})=>{
    if(item.completed || item.noStock || order.closedManually || order.lastRolloverDate===today) return;
    const key=order.id; if(!bySource.has(key)) bySource.set(key,{order,items:[]}); bySource.get(key).items.push(item);
  });
  bySource.forEach(({order,items})=>{
    if(!items.length) return;
    const exists=b.orders.some(x=>x && x.rolloverSourceId===order.id && x.rolloverDate===today);
    if(exists){order.lastRolloverDate=today;changed=true;return;}
    const now=new Date();
    const newOrder={id:'ROL_'+_h(order.id+'|'+today),customer:order.customer,items:items.map(it=>({id:'ITM_'+_h(order.id+'|'+today+'|'+it.id),originItemId:it.originItemId||it.id,name:it.name,qty:it.qty||1,unit:it.unit||'PCS',completed:false,ordered:false,noStock:false,rolloverFromOrderId:order.id})),deletedItems:[],notes:'AUTO-CARRIED PENDING & ORDERED ITEMS FROM '+(order.dateOnly||order.isoDate||''),orderBy:order.orderBy||'CAVE SYSTEM',pickerName:'',adoptedBy:'',closedManually:false,unseenCount:items.length,time:now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),dateOnly:now.toLocaleDateString([], {day:'2-digit',month:'short',year:'numeric'}),isoDate:today,date:now.toLocaleString(),rolloverSourceId:order.id,rolloverDate:today};
    b.orders.push(newOrder); order.lastRolloverDate=today; changed=true;
  });
  if(changed) save(); return changed;
}

  orderEntryActive = false;
  document.body.classList.remove("order-entry-active");

  setLastView("orders");
  document.getElementById("header-area").innerHTML = "";
  

  document.getElementById("page").innerHTML =
    '<h2 style="margin-top:10px;display:flex;justify-content:space-between;align-items:center">Orders <span class="date-nav"><button onclick="shiftOrderDate(-1)" aria-label="Previous day">◀</button><span id="orderDateLabel" onclick="triggerDatePicker()">📅 ' + esc(orderDateLabel()) + '</span><button id="orderDateNext" onclick="shiftOrderDate(1)" aria-label="Next day" ' + ((selectedDateFilter && selectedDateFilter >= getTodayIsoString()) ? 'disabled' : '') + '>▶</button></span></h2>' +
    '<div class="order-header-row">' +
      '<div class="tab-bar">' +
        '<button class="tab-btn ' + (currentOrderTab === 'all' ? 'active' : '') + '" onclick="setOrderTab(\'all\', this)">All</button>' +
        '<button class="tab-btn ' + (currentOrderTab === 'pending' ? 'active' : '') + '" onclick="setOrderTab(\'pending\', this)">Pending</button>' +
        '<button class="tab-btn ' + (currentOrderTab === 'completed' ? 'active' : '') + '" onclick="setOrderTab(\'completed\', this)">Completed</button>' +
      '</div>' +
      '<div class="compact-search-box">' +
        '<span>🔍</span>' +
        '<input id="orderSearch" class="uppercase-input" placeholder="Search..." oninput="filterOrders()">' +
      '</div>' +
      '<div class="three-dots-container" id="menuAnchor">' +
        '<button class="three-dots-btn" onclick="toggleOrdersMenu(event)">⋮</button>' +
      '</div>' +
    '</div>' +
    '<div id="ordersContainer"></div>';
  filterOrders();
}

function toggleOrdersMenu(e){
  e.stopPropagation();

  return selectedDateFilter === y ? "Yesterday" : selectedDateFilter;

function shiftOrderDate(n){
  var today = getTodayIsoString();

  base.setDate(base.getDate() + n);
  var iso = base.getFullYear() + "-" + String(base.getMonth() + 1).padStart(2, "0") + "-" + String(base.getDate()).padStart(2, "0");
  if(iso > today) return;

function showTodaysSummaryModal() {
  vibrate(20);
  let todayIso = getTodayIsoString();
  let b = current();
  let todayOrders = (b.orders || []).filter(o => o && o.isoDate === todayIso && !o.closedManually && !o.deleted);

  let custPendingMap = {};
  let custOrderedMap = {};

  todayOrders.forEach(o => {
    let cust = (o.customer && o.customer !== "undefined") ? o.customer : "UNKNOWN";
    (o.items || []).forEach(item => {
      let qty = Number(item.qty) || 1;
      let name = item.name;

      if (!item.completed && !item.ordered) {
        if (!custPendingMap[cust]) custPendingMap[cust] = [];
        custPendingMap[cust].push({ name: name, qty: qty });
      } else if (item.ordered && !item.completed) {
        if (!custOrderedMap[cust]) custOrderedMap[cust] = [];
        custOrderedMap[cust].push({ name: name, qty: qty });
      }
    });
  });

  let pendingCusts = Object.keys(custPendingMap);
  let orderedCusts = Object.keys(custOrderedMap);

  let pendingHtml = "";
  if (pendingCusts.length) {
    pendingCusts.forEach(c => {
      pendingHtml += '<div style="margin-bottom:8px"><b>' + esc(c) + '</b>';
      custPendingMap[c].forEach(i => {
        pendingHtml += '<div style="padding-left:8px;font-size:13px;color:#4a5568">- ' + esc(i.name) + ' - ' + i.qty + '</div>';
      });
      pendingHtml += '</div>';
    });
  } else {
    pendingHtml = '<div class="muted small">No pending items for today!</div>';
  }

  let orderedHtml = "";
  if (orderedCusts.length) {
    orderedCusts.forEach(c => {
      orderedHtml += '<div style="margin-bottom:8px"><b style="color:#b7791f">' + esc(c) + '</b>';
      custOrderedMap[c].forEach(i => {
        orderedHtml += '<div style="padding-left:8px;font-size:13px;color:#744210">- ' + esc(i.name) + ' - ' + i.qty + '</div>';
      });
      orderedHtml += '</div>';
    });
  } else {
    orderedHtml = '<div class="muted small">No ordered items for today!</div>';
  }

  let textLines = ["*pending items*\n"];

  if (pendingCusts.length) {
    pendingCusts.forEach(c => {
      textLines.push(c.toLowerCase());
      custPendingMap[c].forEach(i => {
        textLines.push("- " + i.name.toLowerCase() + " -" + i.qty);
      });
      textLines.push("");
    });
  }

  textLines.push("\n*ordered*\n");
  if (orderedCusts.length) {
    orderedCusts.forEach(c => {
      textLines.push(c.toLowerCase());
      custOrderedMap[c].forEach(i => {
        textLines.push("- " + i.name.toLowerCase() + " -" + i.qty);
      });
      textLines.push("");
    });
  }

  let fullShareText = textLines.join("\n").trim();

  let modal = document.createElement("div");
  modal.className = "modal-overlay";
  modal.innerHTML =
    '<div class="modal" style="max-height:85vh;overflow-y:auto">' +
      '<h3>📊 Today\'s Items Summary</h3>' +
      '<p class="muted small" style="margin-bottom:12px">Customer-wise pending & ordered list:</p>' +
      '<div style="font-weight:bold;margin-bottom:6px;color:#1a202c;text-transform:lowercase">pending items:</div>' +
      '<div style="background:#f8fafc;padding:10px;border-radius:10px;margin-bottom:12px">' + pendingHtml + '</div>' +
      '<div style="font-weight:bold;margin-bottom:6px;color:#b7791f;text-transform:lowercase">ordered:</div>' +
      '<div style="background:#fffdf5;padding:10px;border-radius:10px;margin-bottom:16px">' + orderedHtml + '</div>' +
      '<div style="display:flex;gap:8px;margin-bottom:8px">' +
        '<button class="btn secondary" style="margin:0;flex:1" id="copySummaryBtn">📋 Copy Summary</button>' +
        '<button class="btn success" style="margin:0;flex:1" id="shareSummaryBtn">💬 WhatsApp</button>' +
      '</div>' +
      '<button class="btn" style="background:#71809a" onclick="this.closest(\'.modal-overlay\').remove()">Close</button>' +
    '</div>';
  document.body.appendChild(modal);

  document.getElementById("copySummaryBtn").onclick = function(){
    vibrate(20);
    navigator.clipboard.writeText(fullShareText);
    showToast("Summary copied to clipboard!");
  };

  document.getElementById("shareSummaryBtn").onclick = function(){
    vibrate(20);

  };

var ORDER_FILTERS = [
  ["all", "All orders"], ["urgent", "\uD83D\uDD34 Has urgent items"], ["packed", "\uD83D\uDCE6 Packed"], ["notpacked", "Not packed"],
  ["haspending", "\u23F3 Has pending items"], ["hasordered", "\uD83D\uDCE6 Has ordered items"], ["hasnostock", "\uD83D\uDEAB Has no-stock items"], ["notadopted", "\u270B Not adopted yet"]
];
function orderMatchesFilter(o){
  var f = currentOrderFilter, items = o.items || [];
  if(f === "all") return true;
  if(f === "urgent") return items.some(function(x){ return x && x.urgent && !x.completed && !x.noStock; });
  if(f === "packed") return !!o.packed;
  if(f === "notpacked") return !o.packed;
  if(f === "haspending") return items.some(function(x){ return x && !x.completed && !x.ordered && !x.noStock; });
  if(f === "hasordered") return items.some(function(x){ return x && x.ordered && !x.completed && !x.noStock; });
  if(f === "hasnostock") return items.some(function(x){ return x && x.noStock && !x.completed; });
  if(f === "notadopted") return !o.adoptedBy;
  return true;
}

}

function searchHitsHtml(o, q){
  if(!q) return "";
  var hits = (o.items || []).filter(function(i){ return i && (((i.name || "").toLowerCase().indexOf(q) !== -1) || ((i.comment || "").toLowerCase().indexOf(q) !== -1)); });

  var shown = hits.slice(0, 8);

    var ic = i.completed ? "\u2705" : (i.noStock ? "\uD83D\uDEAB" : (i.ordered ? "\uD83D\uDCE6" : "\u23F3"));
    var cm = i.comment ? '<div class="item-comment">\uD83D\uDCAC ' + hlText(i.comment, q) + '</div>' : '';
    return '<div class="search-hit"><div class="hit-name">' + ic + ' ' + hlText(i.name, q) + cm + '</div><div class="hit-qty">' + (i.qty || 1) + ' ' + esc(i.unit || "PCS") + '</div></div>';
  }).join("");
  if(hits.length > shown.length) html += '<div class="search-more">+' + (hits.length - shown.length) + ' more matching items</div>';
  return html + '</div>';
}

function setupOrderCardLongPress(ordersToDisplay){
  (ordersToDisplay || []).forEach((o) => {
    let card = document.getElementById("orderCard-" + o.id);
    if(!card) return;
    let timer = null;
    let isMoving = false;
    let touchActive = false;
    let menuOpened = false;

    function cancelPress(){
      if(timer){ clearTimeout(timer); timer = null; }
    }

    function openMenuOnce(){
      if(menuOpened || document.querySelector('.modal-overlay')) return;
      menuOpened = true;
      vibrate(60);
      showOrderOptionsModal(o.id);
    }

    function startTouch(e){
      touchActive = true;
      isMoving = false;
      cancelPress();
      timer = setTimeout(() => {
        if(!isMoving && touchActive) openMenuOnce();
      }, 1500);
    }

    function endTouch(){
      touchActive = false;
      cancelPress();
    }

    function startMouse(){
      // Android may emit synthetic mouse events after touch; ignore them.
      if(touchActive) return;
      isMoving = false;
      cancelPress();
      timer = setTimeout(() => {
        if(!isMoving && !touchActive) openMenuOnce();
      }, 1500);
    }

    card.addEventListener('touchstart', startTouch, {passive:true});
    card.addEventListener('touchmove', () => { isMoving = true; cancelPress(); }, {passive:true});
    card.addEventListener('touchend', endTouch, {passive:true});
    card.addEventListener('touchcancel', endTouch, {passive:true});
    card.addEventListener('mousedown', startMouse);
    card.addEventListener('mouseup', cancelPress);

function deleteOrder(orderId) {
  // Hard permission check: only Admin/Owner can delete an entire order.
  let me = getCurrentMember();
  let canDelete = !!(me && (me.isAdmin || me.isCreator || me.role === "Owner" || me.role === "Administrator" || me.role === "Admin"));
  if(!canDelete){
    showToast("Only Admin can delete an order.");
    return;
  }

  let b = current();
  let order = b && b.orders ? b.orders.find(x => x && x.id === orderId) : null;
  if(!order) return;

  // Three separate confirmations are required before deletion.
  // The order is moved to "Deleted Orders" (not erased) so it can be restored.
  confirmAction("Delete Order? (1/3)", "This order will be deleted (you can restore it later from Deleted Orders). Continue?", function(){
    confirmAction("Delete Order? (2/3)", "Please confirm again: delete this order?", function(){
      confirmAction("FINAL CONFIRMATION (3/3)", "This is the final confirmation. Delete this order?", function(){
        let latestMember = getCurrentMember();
        let stillAdmin = !!(latestMember && (latestMember.isAdmin || latestMember.isCreator || latestMember.role === "Owner" || latestMember.role === "Administrator" || latestMember.role === "Admin"));
        if(!stillAdmin){
          showToast("Only Admin can delete an order.");
          return;
        }
        let idx = b.orders.findIndex(x => x && x.id === orderId);
        if(idx !== -1) {
          b.orders[idx].deleted = true;
          b.orders[idx].deletedAt = new Date().toLocaleString();
          b.orders[idx].deletedBy = (latestMember && latestMember.name) || "";
          logAct("deleted", b.orders[idx]);
          save();
          filterOrders();
          showToast("Order deleted. Restore from ⋮ > Deleted Orders.");
        }
      });
    });
  });
}

function filterOrders(){
  let query = (document.getElementById("orderSearch")?.value || "").toLowerCase().trim();
  let b = current();
  let filtered = (b.orders || []).filter(function(o){
    if(!o || o.deleted) return false;

    let items = o.items || [];
    let completedCount = items.filter(x => x && x.completed).length;
    let isFinished = (items.length > 0 && completedCount === items.length) || o.closedManually;

    if(currentOrderTab === 'pending' && isFinished) return false;
    if(currentOrderTab === 'completed' && !isFinished) return false;

    let customerName = (o.customer || "").toLowerCase();
    let orderBy = (o.orderBy || "").toLowerCase();
    let matchesQuery = !query || customerName.indexOf(query) !== -1 || orderBy.indexOf(query) !== -1 || (o.items || []).some(function(i){ return i && (((i.name || "").toLowerCase().indexOf(query) !== -1) || ((i.comment || "").toLowerCase().indexOf(query) !== -1)); });
    
    let matchesDate = true;
    if(selectedDateFilter) {
      let orderIso = o.isoDate || orderLocalIso(o);
      matchesDate = (orderIso === selectedDateFilter);
    }

    return matchesQuery && matchesDate && orderMatchesFilter(o);
  });
  renderOrdersList(filtered);
}

/* Order detail: iOS-style large title. The customer name shrinks and glides into the centre of a top bar while scrolling. */
function updateStickyCust(){
  var bar = document.getElementById("stickyCust"), ttl = document.getElementById("custTitle"), tx = document.getElementById("stickyCustTxt");
  if(!bar || !ttl || !tx) return;
  var cs = getComputedStyle(ttl), F0 = parseFloat(cs.fontSize) || 24, FIN = 18, sF = FIN / F0;
  tx.style.fontSize = F0 + "px"; tx.style.fontFamily = cs.fontFamily; tx.style.lineHeight = cs.lineHeight;
  var r = ttl.getBoundingClientRect(), br = bar.getBoundingClientRect();
  var safe = Math.max(0, bar.offsetHeight - 44), lh = tx.offsetHeight || F0 * 1.2;
  var tY = safe + (44 - lh * sF) / 2;
  var p = Math.max(0, Math.min(1, 1 - (r.top - tY) / 70));
  var s = 1 + (sF - 1) * p;
  var maxW = Math.max(60, br.width - 110);
  var natW = tx.scrollWidth || r.width;
  var finalX = br.left + br.width / 2 - Math.min(natW * sF, maxW) / 2;
  var x = r.left + (finalX - r.left) * p;
  var y = Math.max(r.top, tY);
  var scaledMax = r.width + (maxW - r.width) * p;
  tx.style.maxWidth = (scaledMax / s) + "px";
  tx.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) scale(" + s.toFixed(4) + ")";
  var on = p > 0.001;
  tx.style.opacity = on ? 1 : 0;
  ttl.style.visibility = on ? "hidden" : "visible";
  bar.style.opacity = p;
  var sv = document.getElementById("stickyViewers");
  if(sv) sv.style.opacity = p;
  bar.style.pointerEvents = p > 0.95 ? "auto" : "none";
}
window.addEventListener("scroll", updateStickyCust, { passive: true });
window.addEventListener("resize", updateStickyCust);

/* ===== Activity log (stored in its own Firebase node so it never slows the main sync) ===== */
var ACT_CACHE = { list: [], loaded: false, error: "" };
function localIsoOf(ts){
  var d = new Date(ts);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function logAct(type, o, itemName){
  try {
    var b = current(); if(!b) return;
    var me = getCurrentMember();
    var who = (me && me.name) || data.currentUser || "Member";
    var e = { t: Date.now(), w: who, y: type, o: (o && o.id) || "", c: (o && o.customer && o.customer !== "undefined") ? o.customer : "", i: itemName || "" };
    ACT_CACHE.list.push(e);
    if(hasFB && b.id){
      db.ref("activity/" + b.id).push(e);
    } else {
      if(!Array.isArray(b.activity)) b.activity = [];
      b.activity.push(e);

    }
  } catch(err){}
}
function loadActivity(cb){
  var b = current();
  ACT_CACHE.error = "";
  if(!hasFB || !b){
    ACT_CACHE.list = ((b && b.activity) || []).slice(); ACT_CACHE.loaded = true; cb(); return;
  }
  db.ref("activity/" + b.id).limitToLast(1500).once("value", function(s){
    var arr = [], v = s.val() || {};
    Object.keys(v).forEach(function(k){ if(v[k] && v[k].t) arr.push(v[k]); });
    arr.sort(function(a, c){ return a.t - c.t; });
    ACT_CACHE.list = arr; ACT_CACHE.loaded = true; cb();
  }, function(err){
    ACT_CACHE.error = "Cannot read activity. Allow the activity path in your Firebase rules.";
    ACT_CACHE.loaded = true; cb();
  });
}

    case "unpicked": return '\u21A9 ' + w + ' unticked ' + it + c;
    case "ordered": return '\uD83D\uDCE6 ' + w + ' marked ' + it + ' ordered' + c;

/* ===== Share order as Image / PDF (drawn on a canvas, no external library) ===== */
function billWrap(ctx, text, maxW){
  var words = String(text || "").split(/\s+/), lines = [], cur = "";
  words.forEach(function(w){
    var test = cur ? cur + " " + w : w;
    if(ctx.measureText(test).width > maxW && cur){ lines.push(cur); cur = w; } else cur = test;
  });
  if(cur) lines.push(cur);
  return lines.length ? lines : [""];
}
function renderBillPages(o, withComments){
  var W = 900, H = 1273, M = 48, pages = [], cv, ctx, y;
  var b = current();
  var cust = (o.customer && o.customer !== "undefined") ? o.customer : "Order";
  var items = (o.items || []).filter(Boolean);
  function newPage(first){
    cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#123b72"; ctx.fillRect(0, 0, W, first ? 150 : 70);
    ctx.fillStyle = "#ffffff"; ctx.textBaseline = "alphabetic";
    if(first){
      ctx.font = "bold 40px sans-serif"; ctx.fillText(String(b.name || "CAVE").slice(0, 30), M, 70);
      ctx.font = "24px sans-serif"; ctx.fillText("ORDER DETAILS", M, 112);
      y = 200;
    } else {
      ctx.font = "bold 28px sans-serif"; ctx.fillText(cust.slice(0, 32) + " (contd.)", M, 46);
      y = 112;
    }
    pages.push(cv);
  }
  function need(h){ if(y + h > H - 90) newPage(false); }
  newPage(true);
  ctx.fillStyle = "#1b2559"; ctx.font = "bold 38px sans-serif";
  billWrap(ctx, cust, W - 2 * M - 220).forEach(function(l){ ctx.fillText(l, M, y); y += 46; });
  ctx.fillStyle = "#718096"; ctx.font = "24px sans-serif";
  ctx.fillText((o.dateOnly || "") + (o.time ? "  \u00B7  " + o.time : ""), M, y); y += 30;
  if(o.packed){
    ctx.save(); ctx.translate(W - 190, 270); ctx.rotate(-0.2);
    ctx.strokeStyle = "#1f8a3b"; ctx.fillStyle = "#1f8a3b"; ctx.lineWidth = 6;
    ctx.strokeRect(-120, -42, 240, 84); ctx.lineWidth = 2; ctx.strokeRect(-112, -34, 224, 68);
    ctx.font = "bold 46px sans-serif"; ctx.textAlign = "center"; ctx.fillText("PACKED", 0, 16);
    ctx.restore(); ctx.textAlign = "left";
  }
  y += 14;
  var groups = [
    ["Completed", "#1f8a3b", items.filter(function(x){ return x.completed; })],
    ["Pending", "#b7791f", items.filter(function(x){ return !x.completed && !x.noStock; })],
    ["No Stock", "#c53030", items.filter(function(x){ return x.noStock && !x.completed; })]
  ];
  groups.forEach(function(g){
    if(!g[2].length) return;
    need(110);
    ctx.fillStyle = g[1]; ctx.fillRect(M, y, W - 2 * M, 48);
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 26px sans-serif";
    ctx.fillText(g[0] + "  (" + g[2].length + ")", M + 16, y + 33); y += 48;
    g[2].forEach(function(it, n){
      ctx.font = "bold 28px sans-serif";
      var nameLines = billWrap(ctx, it.name || "", W - 2 * M - 230);
      var cm = (withComments && it.comment) ? (ctx.font = "22px sans-serif", billWrap(ctx, it.comment, W - 2 * M - 60)) : [];
      var h = nameLines.length * 38 + cm.length * 30 + 24;
      need(h);
      if(n % 2 === 0){ ctx.fillStyle = "#f7fafc"; ctx.fillRect(M, y, W - 2 * M, h); }
      var yy = y + 40;
      ctx.fillStyle = "#1b2559"; ctx.font = "bold 28px sans-serif";
      nameLines.forEach(function(l, k){ ctx.fillText(l, M + 16, yy + k * 38); });
      ctx.textAlign = "right"; ctx.fillStyle = "#2d3748"; ctx.font = "bold 28px sans-serif";
      ctx.fillText((it.qty || 1) + " " + (it.unit || "PCS"), W - M - 16, yy); ctx.textAlign = "left";
      yy += (nameLines.length - 1) * 38;
      if(cm.length){ ctx.fillStyle = "#4a5568"; ctx.font = "italic 22px sans-serif"; cm.forEach(function(l, k){ ctx.fillText(l, M + 16, yy + 32 + k * 30); }); }
      y += h;
    });
    y += 22;
  });
  if(o.notes){
    ctx.font = "24px sans-serif";
    var nl = billWrap(ctx, "Notes: " + o.notes, W - 2 * M);
    need(nl.length * 32 + 30);
    ctx.fillStyle = "#4a5568"; nl.forEach(function(l){ ctx.fillText(l, M, y + 24); y += 32; }); y += 14;
  }
  need(60);
  ctx.fillStyle = "#718096"; ctx.font = "22px sans-serif"; ctx.fillText("Thank you!", M, y + 24);
  pages.forEach(function(c, i){
    var g = c.getContext("2d"); g.fillStyle = "#a0aec0"; g.font = "20px sans-serif"; g.textAlign = "right";
    g.fillText("Page " + (i + 1) + " / " + pages.length, W - M, H - 30); g.textAlign = "left";
  });
  return pages;
}
function canvasBlob(cv, type, q){ return new Promise(function(res){ cv.toBlob(res, type, q); }); }
function buildPdf(imgs){

  begin(2); push("<< /Type /Pages /Kids [" + kids + "] /Count " + imgs.length + " >>\nendobj\n");
  imgs.forEach(function(im, i){
    var pw = 595, ph = Math.round(595 * im.h / im.w * 100) / 100, pg = 3 + 3 * i, ct = 4 + 3 * i, ix = 5 + 3 * i;
    begin(pg); push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + pw + " " + ph + "] /Resources << /XObject << /Im0 " + ix + " 0 R >> >> /Contents " + ct + " 0 R >>\nendobj\n");
    var cs = "q " + pw + " 0 0 " + ph + " 0 0 cm /Im0 Do Q";
    begin(ct); push("<< /Length " + cs.length + " >>\nstream\n" + cs + "\nendstream\nendobj\n");
    begin(ix); push("<< /Type /XObject /Subtype /Image /Width " + im.w + " /Height " + im.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + im.data.length + " >>\nstream\n");

}
function billDownload(file){
  var a = document.createElement("a"), u = URL.createObjectURL(file);
  a.href = u; a.download = file.name; document.body.appendChild(a); a.click();

async function doBillShare(orderId, kind){
  var o = current().orders.find(function(x){ return x && x.id === orderId; });
  if(!o) return;
  var cm = !!(document.getElementById("billComments") || {}).checked;
  var btns = document.querySelectorAll("#billShareModal button"); btns.forEach(function(x){ x.disabled = true; });
  showToast("Preparing...");

    var cust = ((o.customer && o.customer !== "undefined") ? o.customer : "order").replace(/[^A-Za-z0-9]+/g, "_").slice(0, 30) || "order";
    var files = [];

      }

      }

    } else {

}

function confirmDeleteSelectedItems(orderId) {
  if (!itemsToDeleteSet.size) { alert("Please select items to delete first."); return; }
  const selectedIds = Array.from(itemsToDeleteSet);
  confirmAction("Delete " + selectedIds.length + " Items?", "Are you sure you want to delete these selected items?", function(){
    let b = current();
    let o = b && b.orders ? b.orders.find(x => x && x.id === orderId) : null;
    if(!o) { itemsToDeleteSet.clear(); isDeleteItemsMode = false; return; }
    if (!Array.isArray(o.items)) o.items = [];
    if (!Array.isArray(o.deletedItems)) o.deletedItems = [];
    const now = Date.now();
    let deletedCount = 0;
    selectedIds.forEach(itemId => {
      let idx = o.items.findIndex(it => it && String(it.id) === String(itemId));
      if(idx !== -1) {
        let deleted = o.items.splice(idx, 1)[0];
        if (deleted) {
          // A fresh, strictly newer tombstone prevents Firebase merge from restoring this item.
          deleted.deletedAt = new Date(now).toLocaleString();
          deleted.updatedAt = Math.max(now, Number(deleted.updatedAt || 0) + 1);
          o.deletedItems.push(deleted);
          deletedCount++;
        }
      }
    });
    o.updatedAt = Math.max(now, Number(o.updatedAt || 0) + 1);
    save();
    isDeleteItemsMode = false;
    itemsToDeleteSet.clear();
    showToast(deletedCount ? (deletedCount + " item(s) deleted successfully!") : "Selected items were already removed.");
    openOrderDetail(orderId);
  });
}

function parseAddItemsPaste(){
  const area=document.getElementById('addItemsPasteBox'); const box=document.getElementById('modalItemBox'); if(!area||!box) return;
  const raw=area.value.trim(); if(!raw){alert('Paste copied item list first.');return;}
  const lines=raw.split(/\r?\n|;/).map(x=>x.replace(/^\s*(?:[*•–-]+\s*|\d{1,3}[.)]\s+)/,'').trim()).filter(Boolean);
  let added=0; lines.forEach(line=>{ let name=line,qty=1,unit='PCS';
    let m=line.match(/\s+[x×]\s*(\d+)$/i) || line.match(/\s+(\d+)\s*(PCS|PC|PKT|ITEMS|BOX|SET|NOS|KG)?$/i);
    if(m){ qty=parseInt(m[1],10)||1; if(m[2] && !/^x$/i.test(m[2])) unit=m[2].toUpperCase(); name=line.slice(0,m.index).trim(); }
    if(name){ const row=document.createElement('div'); row.className='item-row'; row.innerHTML='<input class="item-name uppercase-input" placeholder="Item name" value="'+esc(name.toUpperCase())+'"><input class="item-qty" type="text" inputmode="numeric" value="'+qty+'"><input class="item-unit uppercase-input" placeholder="Unit" value="'+esc(unit)+'"><button class="remove-item" type="button">×</button>'; box.appendChild(row); const remove=row.querySelector('.remove-item'); remove.onclick=()=>row.remove(); added++; }
  });
  if(added) { area.value=''; showToast(added+' item rows imported'); try{ box.scrollTop = box.scrollHeight; }catch(e){} } else alert('No valid items found.');
}

function setupLongPressEvents(orderId){
  let b = current();
  let o = b.orders.find(x => x && x.id === orderId);
  if(!o) return;
  (o.items || []).forEach(function(item){
    if(!item) return;
    let row = document.getElementById("row-" + item.id);
    if(!row) return;
    let pressTimer = null;
    let isTouchMoving = false;

    row.addEventListener('touchstart', function(){
      isTouchMoving = false;
      pressTimer = setTimeout(function(){
        if(!isTouchMoving) {
          vibrate(50);
          lastLongPressSelectionAt = Date.now();
          toggleSelection(item.id);
        }
      }, 1500);
    }, {passive:true});

    row.addEventListener('touchmove', function(){
      isTouchMoving = true;
      if(pressTimer) clearTimeout(pressTimer);
    }, {passive:true});

    row.addEventListener('touchend', function(){
      if(pressTimer) clearTimeout(pressTimer);
    });

    row.addEventListener('mousedown', function(){
      pressTimer = setTimeout(function(){
        vibrate(50);
        lastLongPressSelectionAt = Date.now();
        toggleSelection(item.id);
      }, 1500);
    });

    row.addEventListener('mouseup', function(){
      if(pressTimer) clearTimeout(pressTimer);
    });
  });
}

  vibrate(30);
  let b = current();
  let o = b.orders.find(x => x && x.id === orderId);
  if(!o) return;
  const existingItem = (o.items || []).find(it => it && it.id === itemId);
  if(existingItem && existingItem.noStock){ existingItem.noStock=false; existingItem.ordered=false; existingItem.completed=false; logAct("unnostock", o, existingItem.name); save(); openOrderDetail(orderId); showToast('Item returned to Pending'); return; }

  if(!rowElement || rowElement.dataset.animating === "true") return;
  rowElement.dataset.animating = "true";
  let circleBtn = rowElement.querySelector('.circle-btn');
  let isCurrentlyCompleted = circleBtn.classList.contains('checked');
  
  if(isCurrentlyCompleted){ circleBtn.classList.remove('checked'); circleBtn.innerHTML = ''; }
  else { circleBtn.classList.add('checked'); circleBtn.innerHTML = '✓'; }
  
  setTimeout(function(){
    rowElement.classList.add('animating-out');
    setTimeout(function(){
      let item = o.items.find(it => it && it.id === itemId);
      if(item) {
        item.completed = !isCurrentlyCompleted;
        if(item.completed) {
          item.ordered = false;
          let me = getCurrentMember();
          item.pickedBy = me ? me.name : (data.currentUser || "Member");
        } else {
          item.pickedBy = "";
        }
        logAct(item.completed ? "picked" : "unpicked", o, item.name);
        save(); 
        var keepY = window.pageYOffset || document.documentElement.scrollTop || 0;
        openOrderDetail(orderId);
        window.scrollTo(0, keepY);
        try{ updateStickyCust(); }catch(e){}
        requestAnimationFrame(function(){ window.scrollTo(0, keepY); });
      }
    }, 350);
  }, 500);
}

// WhatsApp share: no emojis. Order = Completed, then Pending (incl. ordered), then No Stock.
function shareWhatsApp(orderId){
  vibrate(20);
  let o = current().orders.find(x => x && x.id === orderId);
  if(!o) return;
  let items = (o.items || []).filter(Boolean);
  let line = function(x, extra){
    return "- " + (x.name || "") + " - " + (x.qty || 1) + " " + (x.unit || "PCS") + (extra || "");
  };
  let done = items.filter(x => x.completed);
  let nost = items.filter(x => x.noStock && !x.completed);
  let pend = items.filter(x => !x.completed && !x.noStock);

  let parts = [];
  if(done.length) parts.push("*Completed*\n" + done.map(x => line(x)).join("\n"));
  if(pend.length) parts.push("*Pending*\n" + pend.map(x => line(x)).join("\n"));
  if(nost.length) parts.push("*No Stock*\n" + nost.map(x => line(x)).join("\n"));

  let cust = (o.customer && o.customer !== "undefined") ? o.customer : "Order";
  let text = "*Order Details - " + current().name + "*\n*Customer:* " + cust + "\n" +
    "\n" + parts.join("\n\n") +
    (o.notes ? "\n\n*Notes:* " + o.notes : "") +
    "\n\nThank you!";
  window.location.href = "whatsapp://send?text=" + encodeURIComponent(text);
}

  document.getElementById("on").value = d.notes || "";

function parsePastedText() {
  vibrate(30);
  let raw = document.getElementById("pasteBox")?.value.trim() || "";
  if(!raw) {
    alert("Please paste text first!");
    return;
  }
  
  // Remove only a list marker at the very beginning of each line.
  // Never remove digits from inside item names/model numbers (e.g. SP 160, 3.00-10).
  let lines = raw.split(/[\n;]+/)
    .map(s => s.replace(/^\s*(?:(?:[*•–-]+)\s+|\d{1,3}[.)]\s+)/, '').replace(/\*+\s*$/, '').trim())
    .filter(Boolean)
    .filter(s => !/^(pending items|pending|ordered|completed)\s*:?$/i.test(s));
  const box = document.getElementById("orderItems");
  box.innerHTML = "";

  lines.forEach(line => {
    let qty = 1;
    let unit = "PCS";
    let name = line;

    let qtyMatch =
      line.match(/\s+(\d+)\s*(pcs|pc|pkt|items|box|set|nos|kg|x)$/i) ||
      line.match(/\s+[x×]\s*(\d+)$/i) ||
      line.match(/\s+-\s*(\d+)$/) ||
      line.match(/^(\d+)\s*(pcs|pc|pkt|items|box|set|nos|kg|x)\s+/i) ||
      // Common pasted format: "Chain kit SP 160 1" => name SP 160, quantity 1.
      line.match(/\s+(\d+)$/);
    if(qtyMatch) {
      qty = parseInt(qtyMatch[1]) || 1;
      if (qtyMatch[2] && qtyMatch[2].toLowerCase() !== "x") unit = qtyMatch[2].toUpperCase();
      // Remove the matched quantity only at its exact position. String.replace() could
      // remove an earlier identical substring (e.g. the ' 1' inside 'SP 160').
      name = (line.slice(0, qtyMatch.index) + line.slice(qtyMatch.index + qtyMatch[0].length)).trim();
    }

    if(name) {
      addOrderRowWithValues(name.toUpperCase(), qty, unit);
    }
  });

  if(!box.children.length) addOrderRow(false);
  saveOrderDraft();
}

function saveOrder(){
  vibrate(40);
  const c = document.getElementById("oc").value.trim().toUpperCase(), n = document.getElementById("on").value.trim().toUpperCase();
  const rows = Array.prototype.slice.call(document.querySelectorAll("#orderItems .item-row"));
  const items = rows.map(function(row){ 
    return { 
      id: genId("ITM"),
      name: row.querySelector(".item-name").value.trim().toUpperCase(), 
      qty: Number(row.querySelector(".item-qty").value), 
      unit: row.querySelector(".item-unit").value.trim().toUpperCase() || "PCS",
      completed: false, 
      ordered: false 
    }; 
  }).filter(function(x){ return x.name; });
  
  if(!c || !items.length){ alert("Please enter Customer name and at least 1 item."); return; }

  const invalidQty = items.find(x => !Number.isFinite(x.qty) || x.qty <= 0);
  if(invalidQty){
    alert("Please enter a valid quantity (greater than 0) for every item.");
    return;
  }

  let me = getCurrentMember();
  let userName = me ? me.name : (data.currentUser || "Owner");

  let now = new Date();
  if(!current().orders) current().orders = [];
  current().orders.push({ 
    id: genId("ORD"),
    customer: c, 
    items: items, 
    deletedItems: [],
    notes: n, 
    orderBy: userName, 
    pickerName: "", 
    adoptedBy: "",
    closedManually: false,
    unseenCount: items.length,
    time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), 
    dateOnly: now.toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' }), 
    isoDate: getTodayIsoString(), 
    date: now.toLocaleString() 
  });
  
  try { logAct("order_new", current().orders[current().orders.length - 1], String(items.length)); } catch(e){}
  save();
  clearOrderDraft();
  pushTeamNotification("New Order for " + c + " added by " + userName);

  // Leave order-entry mode only after the order is successfully saved.
  orderEntryActive = false;
  document.body.classList.remove("order-entry-active");
  currentScreen = "orders";
  pageOrders(document.getElementById("nav-orders"));
}

function addOrderRowWithValues(nameVal, qtyVal, unitVal, focusNew){
  const box = document.getElementById("orderItems"); if(!box) return;
  const row = document.createElement("div"); row.className = "item-row";
  row.innerHTML = 
    '<input class="item-name uppercase-input" value="' + esc(nameVal) + '" placeholder="Item name" autocomplete="off" enterkeyhint="next" oninput="saveOrderDraft()">' +
    '<input class="item-qty" type="text" inputmode="numeric" value="' + qtyVal + '" autocomplete="off" enterkeyhint="next" oninput="saveOrderDraft()">' +
    '<input class="item-unit uppercase-input" value="' + esc(unitVal) + '" placeholder="Unit" autocomplete="off" enterkeyhint="next" oninput="saveOrderDraft()">' +
    '<button class="remove-item" type="button">×</button>';
  box.appendChild(row);
  
  const name = row.querySelector(".item-name"), qty = row.querySelector(".item-qty"), unit = row.querySelector(".item-unit"), remove = row.querySelector(".remove-item");
  
  name.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.keyCode === 13){ e.preventDefault(); qty.focus(); qty.select(); }
  });
  qty.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.keyCode === 13){ e.preventDefault(); unit.focus(); unit.select(); }
  });
  unit.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.keyCode === 13){ e.preventDefault(); addOrderRow(true); }
  });

  remove.addEventListener("click", function(){
    if(box.querySelectorAll(".item-row").length === 1){ name.value = ""; qty.value = "1"; unit.value = "PCS"; name.focus(); saveOrderDraft(); return; }
    row.remove();
    saveOrderDraft();
  });
  
  if(focusNew) { setTimeout(function(){ name.focus(); }, 60); }
}

function setupTeamLongPress(){
  let b = current();
  (b.team || []).forEach((m) => {
    if(!m) return;
    let row = document.getElementById("teamRow-" + m.id);
    if(!row) return;
    let timer = null;
    let isMoving = false;

    let startPress = function(){
      isMoving = false;
      timer = setTimeout(() => {
        if(!isMoving){
          vibrate(60);
          showTeamMemberOptionsModal(m.id);
        }
      }, 1500);
    };

    let cancelPress = function(){
      if(timer) clearTimeout(timer);
    };

    row.addEventListener('touchstart', startPress, {passive:true});
    row.addEventListener('touchmove', () => { isMoving = true; cancelPress(); }, {passive:true});
    row.addEventListener('touchend', cancelPress);
    row.addEventListener('mousedown', startPress);
    row.addEventListener('mouseup', cancelPress);
  });
}
