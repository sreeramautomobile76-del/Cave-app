function parsePastedText() {
  vibrate(30);
  let raw = document.getElementById("pasteBox")?.value.trim() || "";
  if(!raw) {
    alert("Please paste text first!");
    return;
  }
  
  // Remove only a list marker at the very beginning of each line.
  // Never remove digits from inside item names/model numbers (e.g. SP 160, 3.00-10).
  let lines = raw.split(/[\n;]+/)
    .map(s => s.replace(/^\s*(?:(?:[*•–-]+)\s+|\d{1,3}[.)]\s+)/, '').replace(/\*+\s*$/, '').trim())
    .filter(Boolean)
    .filter(s => !/^(pending items|pending|ordered|completed)\s*:?$/i.test(s));

  // If first line is a customer/header (no trailing qty), put it in Customer field and do not add it as an item.
  if(lines.length){
    let first = lines[0];
    let looksLikeQtyLine = /\s+(\d+)\s*(pcs|pc|pkt|items|box|set|nos|kg|x)?$/i.test(first) || /\s+[x×]\s*(\d+)$/i.test(first) || /\s+-\s*(\d+)$/.test(first);
    let headerLike = /^(customer|cust|name|shop|order for|party)\s*[:\-]/i.test(first);
    let oc = document.getElementById("oc");
    let knownCust = false;
    try {
      let key = String(first || "").replace(/^(customer|cust|name|shop|order for|party)\s*[:\-]?\s*/i, "").replace(/\s+/g, " ").trim().toUpperCase();
      knownCust = !!(current().customers || []).some(function(c){ return c && normCust(c.name) === key; });
    } catch(e){}
    // Skip top line when: explicit header, known customer, or customer box empty and line has no quantity.
    if(headerLike || knownCust || (!looksLikeQtyLine && oc && !oc.value.trim())){
      let custName = first.replace(/^(customer|cust|name|shop|order for|party)\s*[:\-]?\s*/i, "").trim();
      if(oc && custName && !oc.value.trim()) oc.value = custName.toUpperCase();
      lines = lines.slice(1);
    }
  }

  const box = document.getElementById("orderItems");
  box.innerHTML = "";

  lines.forEach(line => {
    let qty = 1;
    let unit = "PCS";
    let name = line;

    let qtyMatch =
      line.match(/\s+(\d+)\s*(pcs|pc|pkt|items|box|set|nos|kg|x)$/i) ||
      line.match(/\s+[x×]\s*(\d+)$/i) ||
      line.match(/\s+-\s*(\d+)$/) ||
      line.match(/^(\d+)\s*(pcs|pc|pkt|items|box|set|nos|kg|x)\s+/i) ||
      // Common pasted format: "Chain kit SP 160 1" => name SP 160, quantity 1.
      line.match(/\s+(\d+)$/);
    if(qtyMatch) {
      qty = parseInt(qtyMatch[1]) || 1;
      if (qtyMatch[2] && qtyMatch[2].toLowerCase() !== "x") unit = qtyMatch[2].toUpperCase();
      // Remove the matched quantity only at its exact position. String.replace() could
      // remove an earlier identical substring (e.g. the ' 1' inside 'SP 160').
      name = (line.slice(0, qtyMatch.index) + line.slice(qtyMatch.index + qtyMatch[0].length)).trim();
    }

    if(name) {
      let u = extractUrgentFromName(name.toUpperCase());
      // Store urgent flag temporarily on the row via data attribute; applied on save.
      addOrderRowWithValues(u.name, qty, unit, false, u.urgent);
    }
  });

  if(!box.children.length) addOrderRow(false);
  saveOrderDraft();
}

function saveOrder(){
  vibrate(40);
  const c = document.getElementById("oc").value.trim().toUpperCase(), n = document.getElementById("on").value.trim().toUpperCase();
  const rows = Array.prototype.slice.call(document.querySelectorAll("#orderItems .item-row"));
  const items = rows.map(function(row){
    var rawName = row.querySelector(".item-name").value.trim().toUpperCase();
    var extracted = extractUrgentFromName(rawName);
    var item = {
      id: genId("ITM"),
      name: extracted.name,
      qty: Number(row.querySelector(".item-qty").value),
      unit: row.querySelector(".item-unit").value.trim().toUpperCase() || "PCS",
      completed: false,
      ordered: false
    };
    if(extracted.urgent || row.dataset.urgent === "1"){
      item.urgent = true;
      item.urgentBy = ((typeof getCurrentMember === "function" && getCurrentMember()) || {}).name || data.currentUser || "Member";
    }
    return item;
  }).filter(function(x){ return x.name; });
  
  if(!c || !items.length){ alert("Please enter Customer name and at least 1 item."); return; }

  const invalidQty = items.find(x => !Number.isFinite(x.qty) || x.qty <= 0);
  if(invalidQty){
    alert("Please enter a valid quantity (greater than 0) for every item.");
    return;
  }

  let me = getCurrentMember();
  let userName = me ? me.name : (data.currentUser || "Owner");

  let now = new Date();
  if(!current().orders) current().orders = [];
  current().orders.push({ 
    id: genId("ORD"),
    customer: c, 
    items: items, 
    deletedItems: [],
    notes: n, 
    orderBy: userName, 
    pickerName: "", 
    adoptedBy: "",
    closedManually: false,
    unseenCount: items.length,
    time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), 
    dateOnly: now.toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' }), 
    isoDate: getTodayIsoString(), 
    date: now.toLocaleString() 
  });
  
  try { logAct("order_new", current().orders[current().orders.length - 1], String(items.length)); } catch(e){}
  save();
  clearOrderDraft();
  pushTeamNotification("New Order for " + c + " added by " + userName);

  // Leave order-entry mode only after the order is successfully saved.
  orderEntryActive = false;
  document.body.classList.remove("order-entry-active");
  currentScreen = "orders";
  pageOrders(document.getElementById("nav-orders"));
}

function addOrderRow(focusNew){
  addOrderRowWithValues("", 1, "PCS", focusNew);
}

function addOrderRowWithValues(nameVal, qtyVal, unitVal, focusNew, isUrgent){
  const box = document.getElementById("orderItems"); if(!box) return;
  const row = document.createElement("div"); row.className = "item-row";
  if(isUrgent) row.dataset.urgent = "1";
  row.innerHTML = 
    '<input class="item-name uppercase-input" value="' + esc(nameVal) + '" placeholder="Item name" autocomplete="off" enterkeyhint="next" oninput="saveOrderDraft()">' +
    '<input class="item-qty" type="text" inputmode="numeric" value="' + qtyVal + '" autocomplete="off" enterkeyhint="next" oninput="saveOrderDraft()">' +
    '<input class="item-unit uppercase-input" value="' + esc(unitVal) + '" placeholder="Unit" autocomplete="off" enterkeyhint="next" oninput="saveOrderDraft()">' +
    '<button class="remove-item" type="button">×</button>';
  box.appendChild(row);
  
  const name = row.querySelector(".item-name"), qty = row.querySelector(".item-qty"), unit = row.querySelector(".item-unit"), remove = row.querySelector(".remove-item");
  
  name.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.keyCode === 13){ e.preventDefault(); qty.focus(); qty.select(); }
  });
  qty.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.keyCode === 13){ e.preventDefault(); unit.focus(); unit.select(); }
  });
  unit.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.keyCode === 13){ e.preventDefault(); addOrderRow(true); }
  });

  remove.addEventListener("click", function(){
    if(box.querySelectorAll(".item-row").length === 1){ name.value = ""; qty.value = "1"; unit.value = "PCS"; name.focus(); saveOrderDraft(); return; }
    row.remove();
    saveOrderDraft();
  });
  
  if(focusNew) { setTimeout(function(){ name.focus(); }, 60); }
}

function pageTeam(btn){
  orderEntryActive = false;
  document.body.classList.remove("order-entry-active");
  currentScreen = "team";
  active(btn);
  setLastView("team");
  document.getElementById("header-area").innerHTML = "";

  var membersHtml = (current().team || []).map(function(m){
    if(!m) return "";
    if(!m.id) m.id = genId("MEM");
    return '<div class="list" id="teamRow-' + esc(m.id) + '"><div>' +
      '<b>' + esc(m.name || "") + ' ' + (m.isCreator ? '👑 (Owner)' : (m.isAdmin ? '⭐ (Admin)' : '')) + '</b>' +
      '<div class="muted small">' + esc(m.role || "") + ' ' + (m.mobile ? '(' + esc(m.mobile) + ')' : '') + '</div>' +
      '</div></div>';
  }).join('');

  document.getElementById("page").innerHTML = '<h2 style="margin-top:10px">Team Members</h2><p class="muted small" style="margin-bottom:10px">Press and hold 2 sec on any member to manage.</p><button class="btn" onclick="addTeamModal()">＋ Add New Member</button>' + membersHtml;

  setupTeamLongPress();

function setupTeamLongPress(){
  let b = current();
  (b.team || []).forEach((m) => {
    if(!m) return;
    let row = document.getElementById("teamRow-" + m.id);
    if(!row) return;
    let timer = null;
    let isMoving = false;

    let startPress = function(){
      isMoving = false;
      timer = setTimeout(() => {
        if(!isMoving){
          vibrate(60);
          showTeamMemberOptionsModal(m.id);
        }
      }, 1500);
    };

    let cancelPress = function(){
      if(timer) clearTimeout(timer);
    };

    row.addEventListener('touchstart', startPress, {passive:true});
    row.addEventListener('touchmove', () => { isMoving = true; cancelPress(); }, {passive:true});
    row.addEventListener('touchend', cancelPress);
    row.addEventListener('mousedown', startPress);
    row.addEventListener('mouseup', cancelPress);
  });
}

function showTeamMemberOptionsModal(memberId){
  let b = current();
  let member = b.team.find(x => x && x.id === memberId);
  if(!member) return;

  let modal = document.createElement("div");
  modal.className = "modal-overlay";
  modal.innerHTML =
    '<div class="modal">' +
      '<h3 style="margin-bottom:4px">' + esc(member.name || "") + '</h3>' +
      '<p class="muted small" style="margin-bottom:14px">Member Actions:</p>' +
      (!member.isAdmin ? '<button class="btn secondary" style="margin-top:0" id="makeAdminBtn">⭐ Make Admin</button>' : '') +
      '<button class="btn danger" style="margin-top:8px" id="removeTeamBtn">🗑 Remove Team Member</button>' +
      '<button class="btn" style="margin-top:12px;background:#71809a" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>' +
    '</div>';
  document.body.appendChild(modal);

  if(document.getElementById("makeAdminBtn")){
    document.getElementById("makeAdminBtn").onclick = () => { modal.remove(); makeAdmin(memberId); };
  }
  document.getElementById("removeTeamBtn").onclick = () => { modal.remove(); removeTeam(memberId); };
}

function makeAdmin(memberId){
  confirmAction("Promote to Admin?", "Are you sure you want to promote this member to Admin?", function(){
    let b = current();
    let member = b.team.find(x => x && x.id === memberId);
    if(member) {
      member.isAdmin = true;
      member.role = "Administrator";
      save();
      pageTeam(document.getElementById("nav-team"));
    }
  });
}

      '<h3 style="margin-bottom:12px">👥 Add Team Member</h3>' +

      '<input id="tmName" class="uppercase-input" placeholder="e.g. RAHUL SHARMA" style="margin-top:4px;margin-bottom:8px">' +
      '<label style="font-size:12px;color:#71809a">Mobile Number</label>' +
      '<input id="tmMobile" inputmode="numeric" placeholder="e.g. 9876543210" style="margin-top:4px;margin-bottom:8px">' +
      '<label style="font-size:12px;color:#71809a">Role</label>' +
      '<input id="tmRole" placeholder="e.g. Manager / Member" value="Member" style="margin-top:4px;margin-bottom:16px">' +
      '<div style="display:flex;gap:10px">' +
        '<button class="btn secondary" style="margin:0;flex:1" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>' +
        '<button class="btn" style="margin:0;flex:1" id="saveTeamBtn">Save</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(modal);

  document.getElementById("saveTeamBtn").onclick = function(){
    let name = document.getElementById("tmName").value.trim().toUpperCase();
    let mobile = document.getElementById("tmMobile").value.trim();
    let role = document.getElementById("tmRole").value.trim() || "Member";
    if(!name){ alert("Please enter member name."); return; }
    if(!current().team) current().team = [];
    current().team.push({ id: genId("MEM"), name: name, mobile: mobile, role: role, isAdmin: false, isCreator: false });

function removeTeam(memberId){
  let member = current().team.find(x => x && x.id === memberId);
  if(!member) return;
  confirmAction("Remove Team Member?", "Are you sure you want to remove " + (member.name || "") + " from the team?", function(){
    let idx = current().team.findIndex(x => x && x.id === memberId);
    if(idx !== -1) {
      (current().removedIds = current().removedIds || []).push(memberId);
      current().team.splice(idx, 1);
      save();
      pageTeam(document.getElementById("nav-team"));
    }
  });
}

function addCustomerModal(prefillName){
  vibrate(20);
  let modal = document.createElement("div");
  modal.className = "modal-overlay";
  modal.innerHTML =
    '<div class="modal">' +
      '<h3 style="margin-bottom:12px">👤 Add New Customer</h3>' +
      '<label style="font-size:12px;color:#71809a">Customer / Shop Name</label>' +
      '<input id="custName" class="uppercase-input" placeholder="e.g. SREE TRADERS" style="margin-top:4px;margin-bottom:8px">' +
      '<label style="font-size:12px;color:#71809a">Phone Number (Optional)</label>' +
      '<input id="custPhone" inputmode="numeric" placeholder="e.g. 9876543210" style="margin-top:4px;margin-bottom:8px">' +
      '<label style="font-size:12px;color:#71809a">Address (Optional)</label>' +
      '<input id="custAddr" placeholder="City or location" style="margin-top:4px;margin-bottom:16px">' +
      '<div style="display:flex;gap:10px">' +
        '<button class="btn secondary" style="margin:0;flex:1" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>' +
        '<button class="btn" style="margin:0;flex:1" id="saveCustBtn">Save</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(modal);
  if(prefillName){ try{ document.getElementById("custName").value = normCust(prefillName); }catch(e){} }

  document.getElementById("saveCustBtn").onclick = function(){
    let name = document.getElementById("custName").value.trim().toUpperCase();
    let phone = document.getElementById("custPhone").value.trim();
    let addr = document.getElementById("custAddr").value.trim();
    if(!name){ alert("Please enter customer name."); return; }
    if(!current().customers) current().customers = [];
    current().customers.push({ id: genId("CUST"), name: name, phone: phone, address: addr });
    save();
    modal.remove();
    pageCustomers(document.getElementById("nav-customers"));
  };

function editCustomerModal(custId){
  if(!canPackOrder()){ showToast("Only the Owner or an Admin can edit customers"); return; }
  var cust = (current().customers || []).find(function(x){ return x && x.id === custId; });
  if(!cust) return;
  vibrate(20);
  var modal = document.createElement("div");
  modal.className = "modal-overlay";
  modal.innerHTML =
    '<div class="modal">' +
      '<h3 style="margin-bottom:12px">\u270F Edit Customer</h3>' +
      '<label style="font-size:12px;color:#71809a">Customer / Shop Name</label>' +
      '<input id="editCustName" class="uppercase-input" style="margin-top:4px;margin-bottom:8px">' +
      '<label style="font-size:12px;color:#71809a">Phone Number (Optional)</label>' +
      '<input id="editCustPhone" inputmode="numeric" style="margin-top:4px;margin-bottom:8px">' +
      '<label style="font-size:12px;color:#71809a">Address (Optional)</label>' +
      '<input id="editCustAddr" style="margin-top:4px;margin-bottom:16px">' +
      '<div style="display:flex;gap:10px">' +
        '<button class="btn secondary" style="margin:0;flex:1" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>' +
        '<button class="btn" style="margin:0;flex:1" id="saveEditCustBtn">Save</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(modal);
  document.getElementById("editCustName").value = cust.name || "";
  document.getElementById("editCustPhone").value = cust.phone || "";
  document.getElementById("editCustAddr").value = cust.address || "";
  document.getElementById("saveEditCustBtn").onclick = function(){
    if(!canPackOrder()) return;
    var name = document.getElementById("editCustName").value.trim().toUpperCase();
    var phone = document.getElementById("editCustPhone").value.trim();
    var addr = document.getElementById("editCustAddr").value.trim();
    if(!name){ alert("Please enter customer name."); return; }
    var oldKey = normCust(cust.name), newKey = normCust(name);
    if(newKey !== oldKey && (current().customers || []).some(function(x){ return x && x.id !== cust.id && normCust(x.name) === newKey; })){
      alert("Another customer with this name already exists."); return;
    }
    cust.name = name; cust.phone = phone; cust.address = addr; cust.updatedAt = Date.now();
    save();
    modal.remove();
    var affected = (current().orders || []).filter(function(o){ return o && normCust(o.customer) === oldKey; });
    if(newKey !== oldKey && affected.length){
      confirmAction("Update past orders?", affected.length + " existing order(s) still show the old name. Update them to " + name + " so the history stays together?", function(){
        affected.forEach(function(o){ o.customer = name; });
        save();
        showToast("Customer and " + affected.length + " order(s) updated");
        openCustomerHistory(name);
      });
    } else {
      showToast("Customer updated");
    }
    openCustomerHistory(name);
  };
}

function removeCustomer(custId){
  if(!canPackOrder()){ showToast("Only the Owner or an Admin can delete customers"); return; }
  let cust = current().customers.find(x => x && x.id === custId);
  if(!cust) return;
  confirmAction("Delete Customer?", "Delete " + (cust.name || "") + " from your Customers list? Past orders will stay as they are.", function(){
    let idx = current().customers.findIndex(x => x && x.id === custId);
    if(idx !== -1) {
      (current().removedIds = current().removedIds || []).push(custId);
      current().customers.splice(idx, 1);
      save();
      showToast("Customer deleted");
      pageCustomers(document.getElementById("nav-customers"));
    }
  });
}
